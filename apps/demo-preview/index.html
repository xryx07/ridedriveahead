<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideDriveAhead — Two Ways. One Platform. Book a Cab | Hire a Driver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand Palette matching user mockup image */
      --bg-dark: #070B19;
      --bg-surface: #0B132B;
      --bg-card: #101935;
      --bg-card-hover: #16234D;
      --bg-card-inner: #0E1630;
      --bg-light: #FFFFFF;
      --border-dark: rgba(255, 255, 255, 0.08);
      --border-lime: rgba(210, 255, 0, 0.35);

      /* Electric Lime & Accent Colors */
      --lime: #D2FF00;
      --lime-dark: #0A1128;
      --lime-glow: rgba(210, 255, 0, 0.3);
      --emerald: #10B981;
      --emerald-dark: #047857;
      --amber: #FBBF24;
      --red: #EF4444;
      --blue: #3B82F6;

      /* Text Hierarchy */
      --text-white: #FFFFFF;
      --text-light: #E2E8F0;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --text-navy: #0A1128;

      /* Radius */
      --radius-2xl: 24px;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Top Switcher Bar */
    .master-view-bar {
      background: #060914;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
    }
    .view-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 900;
      color: var(--text-white);
    }
    .brand-logo-badge span { color: var(--lime); }
    .brand-mode-pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(210, 255, 0, 0.15);
      color: var(--lime);
      border: 1px solid var(--border-lime);
      letter-spacing: 0.4px;
    }

    .view-switcher-pills {
      display: flex;
      gap: 5px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid var(--border-dark);
      flex-wrap: wrap;
    }
    .view-pill-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .view-pill-btn.active {
      background: var(--lime);
      color: var(--lime-dark);
      font-weight: 900;
      box-shadow: 0 2px 10px var(--lime-glow);
    }

    /* Overall Web App Shell */
    .webapp-shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 54px);
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 220px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      flex-shrink: 0;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 24px;
      padding-left: 6px;
    }
    .sidebar-brand span { color: var(--lime); }
    .sidebar-brand-icon {
      width: 26px;
      height: 26px;
      background: var(--lime);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: var(--radius-lg);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-white);
    }
    .nav-item.active {
      background: rgba(210, 255, 0, 0.15);
      color: var(--lime);
      font-weight: 800;
    }
    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
    }

    /* Sidebar User Profile Box */
    .sidebar-profile-box {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 17px;
      background: #1E293B;
      border: 1.5px solid var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--lime);
    }
    .sidebar-user-name { font-size: 12px; font-weight: 800; color: var(--text-white); }
    .sidebar-user-email { font-size: 10px; color: var(--text-dim); }

    /* Main Content Area */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      overflow-y: auto;
      height: calc(100vh - 54px);
    }

    /* Top Web Header Bar */
    .top-header-bar {
      height: 56px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .header-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      position: relative;
    }
    .header-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: var(--lime);
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px 3px 3px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-dark);
      cursor: pointer;
    }
    .user-avatar-img {
      width: 28px;
      height: 28px;
      border-radius: 14px;
      background: #1E293B;
      border: 1.5px solid var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--lime);
    }
    .user-name-text { font-size: 12px; font-weight: 800; color: var(--text-white); }

    .view-content-wrapper {
      padding: 24px 28px 40px 28px;
      flex: 1;
    }

    /* Common Components */
    .btn-lime {
      background: var(--lime);
      color: var(--lime-dark);
      border: none;
      border-radius: var(--radius-lg);
      font-size: 13px;
      font-weight: 900;
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--lime-glow);
      transition: all 0.15s;
    }
    .btn-lime:hover { opacity: 0.95; transform: translateY(-1px); }

    /* ================================================= */
    /* VIEW 1: RIDER HOME DASHBOARD                      */
    /* ================================================= */
    .home-grid-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }
    .home-main-col { display: flex; flex-direction: column; gap: 18px; }

    .greeting-header h1 { font-size: 22px; font-weight: 900; color: var(--text-white); }
    .greeting-header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* Search Bar with Green Circle Arrow */
    .destination-search-box {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 30px;
      padding: 6px 8px 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .search-input-field {
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 13.5px;
      width: 100%;
      outline: none;
    }
    .search-input-field::placeholder { color: var(--text-dim); }
    .search-action-btn {
      width: 38px;
      height: 38px;
      border-radius: 19px;
      background: var(--lime);
      color: var(--lime-dark);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 2px 8px var(--lime-glow);
    }

    /* 4 Service Cards Row (Book a Cab, Hire a Driver, My Car, Schedule) */
    .hero-services-quad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .hero-service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      padding: 16px 14px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
    }
    .hero-service-card:hover {
      border-color: var(--border-lime);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .hero-service-card .card-icon { font-size: 24px; margin-bottom: 8px; }
    .hero-service-card .card-title { font-size: 13.5px; font-weight: 900; color: var(--text-white); }
    .hero-service-card .card-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; line-height: 14px; }

    /* Recent Trips List */
    .recent-trips-section { margin-top: 2px; }
    .recent-trips-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .recent-trips-header h3 { font-size: 13.5px; font-weight: 800; color: var(--text-white); }
    .recent-trips-header a { font-size: 11.5px; font-weight: 700; color: var(--lime); text-decoration: none; cursor: pointer; }
    .recent-trips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .recent-trip-box {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .recent-trip-box:hover { border-color: var(--border-lime); }
    .recent-trip-icon {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .recent-trip-info { flex: 1; min-width: 0; }
    .recent-trip-dest { font-size: 12.5px; font-weight: 800; color: var(--text-white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-trip-date { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .recent-trip-price-col { text-align: right; }
    .recent-trip-price { font-size: 13.5px; font-weight: 900; color: var(--text-white); }
    .recent-trip-badge { font-size: 9px; font-weight: 800; color: var(--emerald); margin-top: 2px; display: block; }

    /* Home Right Column Widgets */
    .home-widgets-col { display: flex; flex-direction: column; gap: 16px; }

    .mini-map-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mini-map-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .mini-map-title { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; }
    .city-select-chip { font-size: 11px; font-weight: 800; color: var(--lime); background: rgba(210, 255, 0, 0.12); padding: 2px 8px; border-radius: 8px; }
    .mini-map-svg-wrap { height: 140px; background: #0F1A3A; position: relative; }
    .map-chip-eta {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 17, 40, 0.9);
      border: 1px solid var(--border-lime);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 900;
      color: var(--lime);
    }

    .upcoming-booking-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .upcoming-left { display: flex; align-items: center; gap: 12px; }
    .upcoming-icon {
      width: 38px;
      height: 38px;
      border-radius: 19px;
      background: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .upcoming-title { font-size: 13px; font-weight: 900; color: var(--navy-deep); }
    .upcoming-time { font-size: 11px; color: #64748B; margin-top: 1px; }
    .btn-view-details {
      background: var(--navy-deep);
      color: #FFFFFF;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .promo-card {
      background: linear-gradient(135deg, #101935 0%, #162548 100%);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130px;
      position: relative;
      overflow: hidden;
    }
    .promo-headline { font-size: 14px; font-weight: 900; color: var(--text-white); max-width: 180px; line-height: 18px; }
    .promo-sub { font-size: 10px; color: var(--lime); font-weight: 700; margin-top: 4px; }
    .promo-car-emoji { position: absolute; right: 12px; bottom: 8px; font-size: 46px; opacity: 0.9; }

    /* ================================================= */
    /* VIEW 2: DESKTOP LIVE TRIP HUD (Bottom-Left)       */
    /* ================================================= */
    .desktop-live-hud-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    .live-hud-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-2xl);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .live-hud-header h2 { font-size: 18px; font-weight: 900; color: #FFFFFF; }
    .live-hud-tripid { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .driver-box-desktop {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .driver-avatar-circle {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: #1E293B;
      border: 2px solid var(--lime);
      color: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
    }
    .driver-name-text { font-size: 14px; font-weight: 900; color: #FFFFFF; }
    .driver-rating-sub { font-size: 11px; color: var(--lime); font-weight: 800; margin-top: 1px; }
    .driver-car-sub { font-size: 10.5px; color: var(--text-muted); }

    .driver-actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .btn-driver-act {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-dark);
      color: #FFFFFF;
      padding: 8px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .trip-stops-box {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .stop-title { font-weight: 800; color: #FFFFFF; }
    .stop-eta { font-size: 10.5px; color: var(--lime); font-weight: 800; }

    .trip-fare-lock-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 12px;
    }
    .fare-lock-amount { font-size: 22px; font-weight: 900; color: #FFFFFF; }

    .safety-features-list {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 14px;
      padding: 12px;
      font-size: 10.5px;
      color: #A7F3D0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
    }

    .desktop-live-map {
      background: #0F1A3A;
      border-radius: var(--radius-2xl);
      border: 1px solid var(--border-dark);
      position: relative;
      overflow: hidden;
    }

    /* ================================================= */
    /* VIEW 3: MOBILE PHONES SHOWCASE (Center & Right)   */
    /* ================================================= */
    .mobile-showcase-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px 0;
    }
    .mobile-phone-frame {
      width: 310px;
      height: 640px;
      background: #0B132B;
      border-radius: 40px;
      border: 7px solid #1E293B;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
    }
    .mobile-phone-frame::-webkit-scrollbar { display: none; }

    .mobile-statusbar {
      height: 32px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: #94A3B8;
      background: #0B132B;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .mobile-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .mobile-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mobile-title-row h3 { font-size: 14px; font-weight: 900; color: #FFFFFF; }

    /* Pill Toggles */
    .mobile-pill-tabs {
      display: flex;
      background: var(--bg-card);
      border-radius: 14px;
      padding: 3px;
      border: 1px solid var(--border-dark);
    }
    .mobile-pill-tab {
      flex: 1;
      padding: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background: none;
    }
    .mobile-pill-tab.active {
      background: var(--lime);
      color: var(--lime-dark);
    }

    /* Duration Selector */
    .duration-pills-row {
      display: flex;
      gap: 6px;
    }
    .duration-pill {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 6px 4px;
      border-radius: 8px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
    }
    .duration-pill.active {
      background: var(--lime);
      color: var(--lime-dark);
      border-color: var(--lime);
    }

    /* Vehicle Type Cards */
    .mobile-vehicle-row {
      display: flex;
      gap: 8px;
    }
    .mobile-veh-card {
      flex: 1;
      background: var(--bg-card);
      border: 1.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
    }
    .mobile-veh-card.active {
      border-color: var(--lime);
      background: var(--bg-card-hover);
    }
    .mobile-veh-name { font-size: 11px; font-weight: 800; color: #FFFFFF; }
    .mobile-veh-fare { font-size: 10px; color: var(--lime); font-weight: 900; margin-top: 2px; }

    /* Switch */
    .pref-switch-row {

    function renderApp() {

            <!-- Middle Row: Mobile Screens & Live HUD -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div style="background: var(--bg-surface); border: 1.5px solid var(--border-dark); border-radius: 28px; overflow: hidden;">
                ${getDesktopLiveHudHtml()}

              <div style="background: var(--bg-surface); border: 1.5px solid var(--border-dark); border-radius: 28px; overflow: hidden;">
                ${getMobilesShowcaseHtml()}
              </div>
            </div>
          </div>
        `;
      } else if (currentView === 'HOME') {
        container.innerHTML = getDesktopHomeHtml();

        container.innerHTML = getDesktopLiveHudHtml();

        container.innerHTML = getMobilesShowcaseHtml();

      } else if (currentView === 'SETTINGS') {
