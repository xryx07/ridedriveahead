<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideDriveAhead — Ola + Uber + Rapido All-in-One Mobility Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       THEME VARIABLES: DARK MODE (DEFAULT) & LIGHT MODE
       ========================================================= */
    :root, [data-theme="dark"] {
      --theme: dark;
      /* Backgrounds */
      --bg-dark: #070B19;
      --bg-surface: #0B132B;
      --bg-card: #101935;
      --bg-card-hover: #16234D;
      --bg-card-inner: #0E1630;
      --master-bar-bg: #060914;
      --sidebar-bg: #0B132B;

      /* Borders */
      --border-dark: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-lime: rgba(210, 255, 0, 0.35);

      /* Electric Lime & Accents */
      --lime: #D2FF00;
      --lime-dark: #0A1128;
      --lime-glow: rgba(210, 255, 0, 0.3);
      --emerald: #10B981;
      --emerald-subtle: rgba(16, 185, 129, 0.12);
      --emerald-text: #34D399;
      --amber: #FBBF24;
      --red: #EF4444;
      --blue: #3B82F6;
      --purple: #8B5CF6;

      /* Text */
      --text-white: #FFFFFF;
      --text-light: #E2E8F0;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --text-navy: #0A1128;

      /* UI Elements */
      --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      --pill-bg: rgba(255, 255, 255, 0.05);
      --pill-hover: rgba(255, 255, 255, 0.1);
      --driver-act-bg: rgba(255, 255, 255, 0.06);
      --search-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

      /* Maps & Frames */
      --map-bg: #0F1A3A;
      --map-road: #16234D;
      --map-text-primary: #E2E8F0;
      --map-text-secondary: #94A3B8;
      --mobile-frame-bg: #0B132B;
      --mobile-border: #1E293B;
      --mobile-statusbar-bg: #0B132B;
      --mobile-bottom-nav-bg: #080D1D;
      --promo-grad: linear-gradient(135deg, #101935 0%, #162548 100%);
      --upcoming-card-bg: #FFFFFF;
      --upcoming-card-title: #0A1128;
      --upcoming-card-sub: #64748B;
      --upcoming-card-btn-bg: #0A1128;
      --upcoming-card-btn-color: #FFFFFF;
      --safety-card-bg: rgba(16, 185, 129, 0.08);
      --safety-card-border: rgba(16, 185, 129, 0.2);
      --safety-card-text: #A7F3D0;
    }

    [data-theme="light"] {
      --theme: light;
      /* Backgrounds */
      --bg-dark: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-card-inner: #F8FAFC;
      --master-bar-bg: #FFFFFF;
      --sidebar-bg: #F8FAFC;

      /* Borders */
      --border-dark: #E2E8F0;
      --border-subtle: #F1F5F9;
      --border-lime: rgba(101, 163, 13, 0.4);

      /* Electric Lime & Accents */
      --lime: #65A30D;
      --lime-dark: #FFFFFF;
      --lime-glow: rgba(101, 163, 13, 0.22);
      --emerald: #059669;
      --emerald-subtle: rgba(5, 150, 105, 0.12);
      --emerald-text: #047857;
      --amber: #D97706;
      --red: #DC2626;
      --blue: #2563EB;
      --purple: #7C3AED;

      /* Text */
      --text-white: #0F172A;
      --text-light: #1E293B;
      --text-muted: #64748B;
      --text-dim: #94A3B8;
      --text-navy: #0F172A;

      /* UI Elements */
      --card-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      --pill-bg: #F1F5F9;
      --pill-hover: #E2E8F0;
      --driver-act-bg: #F1F5F9;
      --search-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Maps & Frames */
      --map-bg: #E2E8F0;
      --map-road: #CBD5E1;
      --map-text-primary: #0F172A;
      --map-text-secondary: #475569;
      --mobile-frame-bg: #FFFFFF;
      --mobile-border: #CBD5E1;
      --mobile-statusbar-bg: #F8FAFC;
      --mobile-bottom-nav-bg: #F1F5F9;
      --promo-grad: linear-gradient(135deg, #F8FAFC 0%, #EEF2F6 100%);
      --upcoming-card-bg: #0F172A;
      --upcoming-card-title: #FFFFFF;
      --upcoming-card-sub: #94A3B8;
      --upcoming-card-btn-bg: #D2FF00;
      --upcoming-card-btn-color: #0A1128;
      --safety-card-bg: #ECFDF5;
      --safety-card-border: #A7F3D0;
      --safety-card-text: #065F46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Top Switcher Bar */
    .master-view-bar {
      background: var(--master-bar-bg);
      border-bottom: 1px solid var(--border-dark);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
      gap: 16px;
    }
    .view-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 900;
      color: var(--text-white);
    }
    .brand-logo-badge span { color: var(--lime); }
    .brand-fusion-pill {
      font-size: 9.5px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(210, 255, 0, 0.15);
      color: var(--lime);
      border: 1px solid var(--border-lime);
      letter-spacing: 0.5px;
    }

    .view-switcher-pills {
      display: flex;
      gap: 5px;
      background: var(--pill-bg);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid var(--border-dark);
      flex-wrap: wrap;
      justify-content: center;
    }
    .view-pill-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .view-pill-btn:hover {
      color: var(--text-white);
      background: var(--pill-hover);
    }
    .view-pill-btn.active {
      background: var(--lime);
      color: var(--lime-dark);
      font-weight: 900;
      box-shadow: 0 2px 10px var(--lime-glow);
    }

    /* Theme Toggle Button */
    .theme-toggle-wrap {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .theme-toggle-btn {
      background: var(--pill-bg);
      border: 1.5px solid var(--border-dark);
      color: var(--text-white);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .theme-toggle-btn:hover {
      background: var(--pill-hover);
      border-color: var(--lime);
      color: var(--lime);
    }

    /* Overall Web App Shell */
    .webapp-shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 54px);
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 230px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      flex-shrink: 0;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 24px;
      padding-left: 6px;
    }
    .sidebar-brand span { color: var(--lime); }
    .sidebar-brand-icon {
      width: 26px;
      height: 26px;
      background: var(--lime);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--lime-dark);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover {
      background: var(--pill-hover);
      color: var(--text-white);
    }
    .nav-item.active {
      background: rgba(210, 255, 0, 0.15);
      color: var(--lime);
      font-weight: 800;
    }
    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
    }

    /* Sidebar User Profile Box */
    .sidebar-profile-box {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .sidebar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 17px;
      background: var(--pill-hover);
      border: 1.5px solid var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--lime);
    }
    .sidebar-user-name { font-size: 12px; font-weight: 800; color: var(--text-white); }
    .sidebar-user-email { font-size: 10px; color: var(--text-dim); }

    /* Main Content Area */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      overflow-y: auto;
      height: calc(100vh - 54px);
    }

    /* Top Web Header Bar */
    .top-header-bar {
      height: 56px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-quick-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .header-radar-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald-text);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 11px;
    }
    .header-pulse-green {
      width: 7px;
      height: 7px;
      border-radius: 3.5px;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }
    .header-right-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 17px;
      background: var(--pill-bg);
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      position: relative;
    }
    .header-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: var(--lime);
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px 3px 3px;
      border-radius: 20px;
      background: var(--pill-bg);
      border: 1px solid var(--border-dark);
      cursor: pointer;
    }
    .user-avatar-img {
      width: 28px;
      height: 28px;
      border-radius: 14px;
      background: var(--pill-hover);
      border: 1.5px solid var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--lime);
    }
    .user-name-text { font-size: 12px; font-weight: 800; color: var(--text-white); }

    .view-content-wrapper {
      padding: 24px 28px 40px 28px;
      flex: 1;
    }

    /* Common Buttons */
    .btn-lime {
      background: var(--lime);
      color: var(--lime-dark);
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--lime-glow);
      transition: all 0.15s;
    }
    .btn-lime:hover { opacity: 0.95; transform: translateY(-1px); }

    /* ================================================= */
    /* VIEW 1: RIDER HOME (OLA + UBER + RAPIDO FUSION)   */
    /* ================================================= */
    .home-grid-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 22px;
    }
    .home-main-col { display: flex; flex-direction: column; gap: 18px; }

    .greeting-header h1 { font-size: 22px; font-weight: 900; color: var(--text-white); }
    .greeting-header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* OLA/UBER/RAPIDO MULTI-MODAL CATEGORY SELECTOR STRIP */
    .multimodal-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .multimodal-strip::-webkit-scrollbar { display: none; }
    .mode-chip {
      background: var(--bg-card);
      border: 1.5px solid var(--border-dark);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      box-shadow: var(--card-shadow);
    }
    .mode-chip:hover {
      border-color: var(--lime);
      background: var(--bg-card-hover);
    }
    .mode-chip.active {
      border-color: var(--lime);
      background: rgba(210, 255, 0, 0.12);
    }
    .mode-chip-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--pill-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mode-chip-info { display: flex; flex-direction: column; }
    .mode-chip-title { font-size: 12.5px; font-weight: 900; color: var(--text-white); }
    .mode-chip-sub { font-size: 10px; color: var(--lime); font-weight: 800; }

    /* Destination Search Box with Uber "+ Add Stop" */
    .search-panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: var(--search-shadow);
    }
    .search-inputs-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-dot-pickup { width: 10px; height: 10px; border-radius: 5px; background: var(--emerald); flex-shrink: 0; }
    .search-dot-drop { width: 10px; height: 10px; border-radius: 2px; background: var(--red); flex-shrink: 0; }
    .search-box-field {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 9px 14px;
      color: var(--text-white);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .search-box-field::placeholder { color: var(--text-dim); }
    .btn-add-stop {
      background: var(--pill-bg);
      border: 1px solid var(--border-dark);
      color: var(--text-white);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-add-stop:hover { border-color: var(--lime); color: var(--lime); }

    /* Saved Places Shortcuts */
    .saved-chips-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .saved-chip-btn {
      background: var(--pill-bg);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .saved-chip-btn:hover {
      color: var(--text-white);
      border-color: var(--lime);
    }

    /* RIDE TIERS LIST (RAPIDO BIKE, OLA AUTO, UBER GO/SEDAN/SUV, CHAUFFEUR) */
    .ride-tiers-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .ride-tiers-heading h3 { font-size: 14px; font-weight: 900; color: var(--text-white); }
    .ride-tiers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .ride-tier-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-dark);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
      box-shadow: var(--card-shadow);
    }
    .ride-tier-card:hover {
      border-color: var(--border-lime);
      background: var(--bg-card-hover);
    }
    .ride-tier-card.active {
      border-color: var(--lime);
      background: rgba(210, 255, 0, 0.08);
      box-shadow: 0 4px 20px var(--lime-glow);
    }
    .tier-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tier-icon-box {
      font-size: 26px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--pill-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tier-info-col { display: flex; flex-direction: column; }
    .tier-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tier-title { font-size: 13px; font-weight: 900; color: var(--text-white); }
    .tier-tag {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(210, 255, 0, 0.15);
      color: var(--lime);
    }
    .tier-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
    .tier-eta { font-size: 10px; color: var(--emerald-text); font-weight: 800; margin-top: 1px; }
    .tier-right { text-align: right; }
    .tier-fare { font-size: 16px; font-weight: 900; color: var(--text-white); }
    .tier-fare-active { color: var(--lime); }
    .tier-lock-lbl { font-size: 9px; color: var(--text-dim); }

    /* Home Right Column Widgets */
    .home-widgets-col { display: flex; flex-direction: column; gap: 16px; }

    /* Interactive Live Map Card */
    .mini-map-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--card-shadow);
    }
    .mini-map-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    .mini-map-title { font-size: 11px; font-weight: 800; color: var(--text-muted); }
    .mini-map-svg-wrap { height: 160px; background: var(--map-bg); position: relative; }
    .map-chip-eta {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 17, 40, 0.9);
      border: 1px solid var(--border-lime);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 900;
      color: #D2FF00;
    }

    /* Checkout & Payment Box */
    .checkout-box {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .checkout-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .coupon-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(210, 255, 0, 0.1);
      border: 1px dashed var(--border-lime);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--lime);
      font-weight: 800;
      cursor: pointer;
    }
    .payment-select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--pill-bg);
      padding: 8px 12px;

    function renderApp() {
      const container = document.getElementById('main-view-container');

      if (currentView === 'SHOWCASE') {
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px;">
            <!-- Top Row: Desktop Rider Home -->
            <div style="background: var(--bg-surface); border: 1.5px solid var(--border-dark); border-radius: 28px; overflow: hidden; box-shadow: var(--card-shadow);">
              ${getDesktopHomeHtml()}
            </div>

            <!-- Middle Row: Mobile Screens & Live HUD -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div style="background: var(--bg-surface); border: 1.5px solid var(--border-dark); border-radius: 28px; overflow: hidden;">
                ${getDesktopLiveHudHtml()}
              </div>
              <div style="background: var(--bg-surface); border: 1.5px solid var(--border-dark); border-radius: 28px; overflow: hidden;">
                ${getMobilesShowcaseHtml()}
              </div>
            </div>
          </div>
        `;
      } else if (currentView === 'HOME') {
        container.innerHTML = getDesktopHomeHtml();
      } else if (currentView === 'LIVEHUD') {
        container.innerHTML = getDesktopLiveHudHtml();
      } else if (currentView === 'MOBILES') {
        container.innerHTML = getMobilesShowcaseHtml();
      } else if (currentView === 'GIGS') {
        container.innerHTML = getGigsHtml();
      } else if (currentView === 'SETTINGS') {

      }
    }
