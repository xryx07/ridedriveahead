<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideDriveAhead — One App. Every Way to Move.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       CALM & MATURE MOBILITY OS DESIGN SYSTEM
       80% Calm Dark/Light Interface | 15% Data | 5% Lime Emphasis
       ========================================================= */
    :root, [data-theme="dark"] {
      --theme: dark;
      --bg: #0B0D0F;
      --surface: #121619;
      --surface-2: #181D20;
      --surface-3: #20262B;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-strong: rgba(255, 255, 255, 0.16);

      --primary: #C7FF3D;          /* Electric Lime used sparingly */
      --primary-dim: rgba(199, 255, 61, 0.12);
      --primary-border: rgba(199, 255, 61, 0.28);
      --primary-text: #0B0D0F;

      --text: #F4F6F3;
      --text-secondary: #929A96;
      --text-tertiary: #606864;

      --danger: #FF4D4D;
      --danger-dim: rgba(255, 77, 77, 0.12);
      --success: #71D88A;
      --success-dim: rgba(113, 216, 138, 0.12);
      --warning: #F5A623;
      --warning-dim: rgba(245, 166, 35, 0.12);

      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --map-water: #0F1316;
      --map-land: #121619;
      --map-road: #1A2126;
      --map-route: #C7FF3D;
    }

    [data-theme="light"] {
      --theme: light;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-2: #F1F5F9;
      --surface-3: #E2E8F0;
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --border-strong: #CBD5E1;

      --primary: #4D7C0F;
      --primary-dim: rgba(77, 124, 15, 0.1);
      --primary-border: rgba(77, 124, 15, 0.3);
      --primary-text: #FFFFFF;

      --text: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;

      --danger: #DC2626;
      --danger-dim: rgba(220, 38, 38, 0.1);
      --success: #16A34A;
      --success-dim: rgba(22, 163, 74, 0.1);
      --warning: #D97706;
      --warning-dim: rgba(217, 119, 6, 0.1);

      --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      --map-water: #E2E8F0;
      --map-land: #F8FAFC;
      --map-road: #CBD5E1;
      --map-route: #4D7C0F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================================
       GLOBAL PLATFORM BAR & 5-PRODUCT PORTAL SELECTOR
       ========================================================= */
    .platform-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .brand-title span {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .brand-tagline {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    /* Portal Switcher Tabs */
    .portal-nav {
      display: flex;
      background: var(--surface-2);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .portal-tab {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
    }
    .portal-tab:hover {
      color: var(--text);
    }
    .portal-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .platform-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--success);
      background: var(--success-dim);
      border: 1px solid rgba(113, 216, 138, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .status-dot-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .theme-toggle-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }

    /* Subview Bar */
    .subview-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }
    .subview-bar::-webkit-scrollbar { display: none; }
    .subview-tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .subview-tab:hover {
      color: var(--text);
      background: var(--surface-2);
    }
    .subview-tab.active {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border);
      font-weight: 700;
    }

    /* Workspace */
    .main-workspace {
      flex: 1;
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .grid-2col { grid-template-columns: 1fr; }
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .grid-3col { grid-template-columns: 1fr; }
    }

    /* Cards & Components */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-3);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    /* =========================================================
       8-TILE MOBILITY HUB GRID (HOME)
       ========================================================= */
    .mobility-tiles-row {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 1200px) {
      .mobility-tiles-row { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 640px) {
      .mobility-tiles-row { grid-template-columns: repeat(2, 1fr); }
    }

    .mobility-tile-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .mobility-tile-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-2);
    }
    .mobility-tile-btn.active {
      border-color: var(--primary);
      background: var(--surface-2);
    }
    .mobility-tile-btn.differentiator {
      border-color: var(--primary-border);
      background: var(--primary-dim);
    }
    .tile-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 8px;
      font-weight: 800;
      color: var(--primary-text);
      background: var(--primary);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .tile-emoji-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .tile-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }
    .tile-desc {
      font-size: 9.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Destination Search Box */
    .dest-search-bar {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: var(--card-shadow);
    }
    .dest-search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }
    .dest-search-input::placeholder { color: var(--text-tertiary); }

    /* Price Control Bar: Fastest vs Saver vs Premium */
    .price-control-strip {
      display: flex;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
      gap: 4px;
      margin-bottom: 16px;
    }
    .price-control-tab {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .price-control-tab:hover { color: var(--text); }
    .price-control-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* Route Planner with Multi-Stop */
    .route-planner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .route-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .route-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .route-dot.pickup { background: var(--success); }
    .route-dot.stop { background: var(--warning); }
    .route-dot.drop { background: var(--danger); }

    .route-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }

    /* Tiers List */
    .tiers-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tier-row {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tier-row:hover { border-color: var(--border-strong); }
    .tier-row.active {
      border-color: var(--primary);
      background: var(--surface-3);
    }
    .tier-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tier-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .tier-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .tier-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .tier-fare {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }
    .tier-locked-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Verified pill */
    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--success);
      background: var(--success-dim);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Handover & Trust */
    .handover-metric-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .handover-metric-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .handover-metric-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    /* KPI Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 1200px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .kpi-row { grid-template-columns: 1fr 1fr; }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .kpi-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }
    .kpi-sub {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* Tables */
    .ops-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .ops-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .ops-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text);
    }
    .ops-table tr:hover td { background: var(--surface-2); }

    /* OTP Display */
    .otp-pin-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .otp-digit {
      width: 32px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    /* Mobile Duo */
    .mobile-duo-container {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 16px 0;
      flex-wrap: wrap;
    }
    .phone-frame {
      width: 340px;
      height: 680px;
      background: var(--surface);
      border: 3px solid var(--border-strong);
      border-radius: 36px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-notch {
      height: 24px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .phone-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .phone-body::-webkit-scrollbar { display: none; }
    .phone-bottom-nav {
      height: 52px;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }
    .phone-nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      gap: 2px;
    }
    .phone-nav-tab.active { color: var(--primary); }
    .phone-nav-tab span:first-child { font-size: 14px; }
  </style>
</head>
<body>

  <!-- =========================================================
       GLOBAL PLATFORM HEADER
       ========================================================= -->
  <header class="platform-header">
    <div class="brand-section">
      <div class="brand-logo-badge">🚗</div>
      <div>
        <div class="brand-title">RideDrive<span>Ahead</span></div>
        <div class="brand-tagline">One app. Every way to move.</div>
      </div>
    </div>

    <!-- 5 Major Portals -->
    <nav class="portal-nav">
      <button class="portal-tab active" id="tab-rider" onclick="setPortal('RIDER')">
        <span>👤</span> Rider Web
      </button>
      <button class="portal-tab" id="tab-driver" onclick="setPortal('DRIVER')">
        <span>👨‍✈️</span> Captain OS
      </button>
      <button class="portal-tab" id="tab-business" onclick="setPortal('BUSINESS')">
        <span>🏢</span> Business Platform
      </button>
      <button class="portal-tab" id="tab-admin" onclick="setPortal('ADMIN')">
        <span>🖥️</span> Admin Command
      </button>
      <button class="portal-tab" id="tab-mobile" onclick="setPortal('MOBILE')">
        <span>📱</span> Mobile Studio
      </button>
    </nav>

    <!-- Telemetry & Controls -->
    <div class="platform-actions">
      <div class="status-pill">
        <div class="status-dot-pulse"></div>
        <span>2,481 Active Rides</span>
      </div>
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- =========================================================
       SUB-NAVIGATION FOR RIDER WEB
       ========================================================= -->
  <div class="subview-bar" id="rider-subnav">
    <button class="subview-tab active" onclick="setRiderSub('HUB')">🏠 Mobility Hub</button>
    <button class="subview-tab" onclick="setRiderSub('CAB')">🚗 Cab (Mini/Sedan/SUV)</button>
    <button class="subview-tab" onclick="setRiderSub('AUTO')">🛺 Auto (Meter Guarantee)</button>
    <button class="subview-tab" onclick="setRiderSub('BIKE')">🏍 Bike (Rapido Fast)</button>
    <button class="subview-tab" onclick="setRiderSub('CHAUFFEUR')">👨‍✈️ Driver (My Car)</button>
    <button class="subview-tab" onclick="setRiderSub('RENTAL')">🚘 Rental (Hourly)</button>
    <button class="subview-tab" onclick="setRiderSub('OUTSTATION')">🛣 Outstation (Intercity)</button>
    <button class="subview-tab" onclick="setRiderSub('AIRPORT')">✈️ Airport Reserve</button>
    <button class="subview-tab" onclick="setRiderSub('DELIVERY')">📦 Delivery Parcel</button>
    <button class="subview-tab" onclick="setRiderSub('SAFETY')">🛡️ Safety Platform</button>
    <button class="subview-tab" onclick="setRiderSub('WALLET')">💳 Wallet & Rewards</button>
  </div>

  <!-- SUB-NAVIGATION FOR DRIVER / CAPTAIN OS -->
  <div class="subview-bar" id="driver-subnav" style="display: none;">

  <script>
    // State
    let activePortal = 'RIDER';
    let riderSub = 'HUB';
    let driverSub = 'COCKPIT';
    let businessSub = 'OVERVIEW';
    let adminSub = 'LIVE';

    let pricePreference = 'FASTEST'; // FASTEST | SAVER | COMFORT
    let hasIntermediateStop = false;
    let isRideShareActive = false;
    let bookingForPerson = 'ME'; // ME | MOM | DAD | SISTER

    // Driver OS State
    let isDriverOnline = true;
    let driverModes = { cab: true, auto: true, bike: false, chauffeur: true, delivery: true };

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('rda_theme', newTheme);
    }

    // Portal Switching
    function setPortal(portal) {
      activePortal = portal;
      document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${portal.toLowerCase()}`).classList.add('active');

      document.getElementById('rider-subnav').style.display = portal === 'RIDER' ? 'flex' : 'none';
      document.getElementById('driver-subnav').style.display = portal === 'DRIVER' ? 'flex' : 'none';
      document.getElementById('business-subnav').style.display = portal === 'BUSINESS' ? 'flex' : 'none';
      document.getElementById('admin-subnav').style.display = portal === 'ADMIN' ? 'flex' : 'none';

      renderApp();
    }

    function setRiderSub(sub) {
      riderSub = sub;
      updateSubnavActive('rider-subnav', sub);
      renderApp();
    }

    function setDriverSub(sub) {
      driverSub = sub;
      updateSubnavActive('driver-subnav', sub);
      renderApp();
    }

    function setBusinessSub(sub) {
      businessSub = sub;
      updateSubnavActive('business-subnav', sub);
      renderApp();
    }

    function setAdminSub(sub) {
      adminSub = sub;
      updateSubnavActive('admin-subnav', sub);
      renderApp();
    }

    function updateSubnavActive(containerId, activeSub) {
      const container = document.getElementById(containerId);
      const btns = container.querySelectorAll('.subview-tab');
      btns.forEach(btn => {
        if (btn.getAttribute('onclick').includes(activeSub)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // =========================================================
    // 1. RIDER WEB EXPERIENCE
    // =========================================================
    function renderRiderWeb() {
      if (riderSub === 'CAB') return renderCabFlow();
      if (riderSub === 'AUTO') return renderAutoFlow();
      if (riderSub === 'BIKE') return renderBikeFlow();
      if (riderSub === 'CHAUFFEUR') return renderChauffeurFlow();
      if (riderSub === 'RENTAL') return renderRentalFlow();
      if (riderSub === 'OUTSTATION') return renderOutstationFlow();
      if (riderSub === 'AIRPORT') return renderAirportFlow();
      if (riderSub === 'DELIVERY') return renderDeliveryFlow();
      if (riderSub === 'SAFETY') return renderSafetyFlow();
      if (riderSub === 'WALLET') return renderWalletFlow();
      return renderMobilityHub();
    }

    function renderMobilityHub() {
      return `

            <!-- Start Trip PIN & Safety Shield -->

              <div class="card-header">

                <div class="verified-pill">Protected</div>

              <div style="background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">

            </div>
          </div>
