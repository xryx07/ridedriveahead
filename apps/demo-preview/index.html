<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideDriveAhead — Mobility Operating System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       CALM & PROFESSIONAL MOBILITY DESIGN SYSTEM
       80% Calm Interface | 15% Informative Data | 5% Lime Accent
       ========================================================= */
    :root, [data-theme="dark"] {
      --theme: dark;
      --bg: #0B0D0F;
      --surface: #121619;
      --surface-2: #181D20;
      --surface-3: #20262B;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-strong: rgba(255, 255, 255, 0.16);

      --primary: #C7FF3D;          /* Lime used sparingly */
      --primary-dim: rgba(199, 255, 61, 0.12);
      --primary-border: rgba(199, 255, 61, 0.28);
      --primary-text: #0B0D0F;

      --text: #F4F6F3;
      --text-secondary: #929A96;
      --text-tertiary: #606864;

      --danger: #FF4D4D;
      --danger-dim: rgba(255, 77, 77, 0.12);
      --success: #71D88A;
      --success-dim: rgba(113, 216, 138, 0.12);
      --warning: #F5A623;
      --warning-dim: rgba(245, 166, 35, 0.12);

      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --map-water: #0F1316;
      --map-land: #121619;
      --map-road: #1A2126;
      --map-route: #C7FF3D;
    }

    [data-theme="light"] {
      --theme: light;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-2: #F1F5F9;
      --surface-3: #E2E8F0;
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --border-strong: #CBD5E1;

      --primary: #4D7C0F;
      --primary-dim: rgba(77, 124, 15, 0.1);
      --primary-border: rgba(77, 124, 15, 0.3);
      --primary-text: #FFFFFF;

      --text: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;

      --danger: #DC2626;
      --danger-dim: rgba(220, 38, 38, 0.1);
      --success: #16A34A;
      --success-dim: rgba(22, 163, 74, 0.1);
      --warning: #D97706;
      --warning-dim: rgba(217, 119, 6, 0.1);

      --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      --map-water: #E2E8F0;
      --map-land: #F8FAFC;
      --map-road: #CBD5E1;
      --map-route: #4D7C0F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================================
       GLOBAL PLATFORM BAR & PORTAL SELECTOR
       ========================================================= */
    .platform-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .brand-title span {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .brand-tagline {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    /* Portal Switcher Tabs */
    .portal-nav {
      display: flex;
      background: var(--surface-2);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .portal-tab {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
    }
    .portal-tab:hover {
      color: var(--text);
    }
    .portal-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .platform-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--success);
      background: var(--success-dim);
      border: 1px solid rgba(113, 216, 138, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .status-dot-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .theme-toggle-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .theme-toggle-btn:hover {
      border-color: var(--border-strong);
    }

    /* =========================================================
       SUB-BAR FOR SUB-VIEWS
       ========================================================= */
    .subview-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }
    .subview-tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .subview-tab:hover {
      color: var(--text);
      background: var(--surface-2);
    }
    .subview-tab.active {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border);
      font-weight: 700;
    }

    /* =========================================================
       CORE LAYOUT CONTAINERS
       ========================================================= */
    .main-workspace {
      flex: 1;
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .grid-2col { grid-template-columns: 1fr; }
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 1024px) {
      .grid-3col { grid-template-columns: 1fr; }
    }

    /* =========================================================
       INTENT SELECTION CARDS (THE CENTRAL USER DECISION)
       ========================================================= */
    .intent-hero {
      margin-bottom: 24px;
    }
    .intent-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .intent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 640px) {
      .intent-grid { grid-template-columns: 1fr; }
    }

    .intent-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .intent-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-2);
    }
    .intent-card.active {
      border-color: var(--primary);
      background: var(--surface);
    }
    .intent-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .intent-card.active .intent-badge {
      background: var(--primary-dim);
      color: var(--text);
      border: 1px solid var(--primary-border);
    }
    .intent-card:not(.active) .intent-badge {
      background: var(--surface-2);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .intent-card-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .intent-card-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* =========================================================
       CALM CARD COMPONENTS
       ========================================================= */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-3);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    /* =========================================================
       ROUTE PLANNER WITH MULTI-STOP (+ ADD STOP)
       ========================================================= */
    .route-planner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .route-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .route-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .route-dot.pickup { background: var(--success); }
    .route-dot.stop { background: var(--warning); }
    .route-dot.drop { background: var(--danger); }

    .route-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }
    .route-input::placeholder { color: var(--text-tertiary); }

    .add-stop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }
    .add-stop-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .add-stop-btn:hover { color: var(--text); }

    /* =========================================================
       VEHICLE / SERVICE SELECTION TIERS
       ========================================================= */
    .tiers-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tier-row {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tier-row:hover {
      border-color: var(--border-strong);
    }
    .tier-row.active {
      border-color: var(--primary);
      background: var(--surface-3);
    }
    .tier-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tier-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .tier-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .tier-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .tier-right {
      text-align: right;
    }
    .tier-fare {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }
    .tier-locked-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* =========================================================
       "MY CAR" ELEVATED PROFILE CARD
       ========================================================= */
    .my-car-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .my-car-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .my-car-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .my-car-reg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      display: inline-block;
      margin-top: 4px;
    }
    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--success);
      background: var(--success-dim);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .car-specs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .car-spec-box {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .car-spec-label {
      font-size: 9.5px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      font-weight: 700;
    }
    .car-spec-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }

    .driver-req-box {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border-subtle);
    }
    .driver-req-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .driver-req-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .req-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text);
      font-weight: 600;
    }
    .req-check {
      color: var(--success);
      font-weight: 800;
    }

    /* =========================================================
       VEHICLE HANDOVER PROTOCOL (DIGITAL VERIFICATION)
       ========================================================= */
    .handover-protocol-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .handover-step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .handover-step-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text);
    }
    .handover-status-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--primary-dim);
      color: var(--text);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--primary-border);
    }

    .handover-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .handover-metric-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .handover-metric-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .handover-metric-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 360 Condition Checklist */
    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .checklist-grid { grid-template-columns: 1fr 1fr; }
    }
    .checklist-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .checklist-side {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
    }
    .checklist-status {
      font-size: 10px;
      color: var(--success);
      font-weight: 700;
      margin-top: 2px;
    }

    /* Dual Digital Signatures */
    .signatures-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .sign-box {
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sign-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--success-dim);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
    }
    .sign-info {
      font-size: 10.5px;
      color: var(--text-secondary);
    }
    .sign-info strong {
      display: block;
      color: var(--text);
      font-size: 11px;
    }

    /* =========================================================
       COMPACT TRUST PROFILE (CHAUFFEUR VERIFICATION OUTCOMES)
       ========================================================= */
    .trust-profile-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .trust-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .trust-driver-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .trust-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .trust-driver-name {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
    }
    .trust-driver-rating {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .trust-badges-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .trust-chip {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .trust-chip span { color: var(--success); }

    .trust-bar-row {
      margin-bottom: 6px;
    }
    .trust-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .trust-bar-track {
      height: 4px;
      background: var(--surface-3);
      border-radius: 2px;
      overflow: hidden;
    }
    .trust-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
    }

    /* =========================================================
       DRIVER OS: READINESS & FATIGUE COCKPIT
       ========================================================= */
    .driver-os-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media (max-width: 768px) {
      .driver-os-header { flex-direction: column; align-items: flex-start; gap: 16px; }
    }

    .readiness-cockpit-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .readiness-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .readiness-status-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .readiness-status-tag.ready {
      background: var(--success-dim);
      color: var(--success);
      border: 1px solid rgba(113, 216, 138, 0.2);
    }
    .readiness-status-tag.break {
      background: var(--warning-dim);
      color: var(--warning);
      border: 1px solid rgba(245, 166, 35, 0.2);
    }

    .readiness-metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .readiness-metrics-grid { grid-template-columns: 1fr 1fr; }
    }
    .readiness-metric-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .readiness-metric-label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .readiness-metric-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .readiness-progress-wrap {
      margin-bottom: 12px;
    }
    .readiness-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .readiness-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .readiness-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      width: 71%;
    }

    .readiness-note {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* =========================================================
       GIG MARKETPLACE CARDS
       ========================================================= */
    .gig-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.15s;
    }
    .gig-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-3);
    }
    .gig-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .gig-category {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }
    .gig-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }
    .gig-fare {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }
    .gig-route {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .gig-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .gig-tag {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .gig-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .gig-dist {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* =========================================================
       AIRPORT TRIP ASSURANCE CARD
       ========================================================= */
    .assurance-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .assurance-step-row {
      display: flex;
      justify-content: space-between;
      margin: 16px 0;
      position: relative;
    }
    .assurance-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 1;
    }
    .assurance-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
    }
    .assurance-dot.done {
      background: var(--success-dim);
      border-color: var(--success);
      color: var(--success);
    }
    .assurance-dot.current {
      background: var(--primary-dim);
      border-color: var(--primary);
      color: var(--text);
    }
    .assurance-step-text {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
    }

    /* =========================================================
       ADMIN COMMAND CENTER CONSOLE
       ========================================================= */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 1200px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .kpi-row { grid-template-columns: 1fr 1fr; }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .kpi-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }
    .kpi-sub {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* Operations Table */
    .ops-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .ops-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    .ops-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text);
    }
    .ops-table tr:hover td {
      background: var(--surface-2);
    }

    /* =========================================================
       SAFETY CENTER STATUS (PROTECTED & TELEMETRY)
       ========================================================= */
    .safety-shield-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .shield-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .shield-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--success-dim);
      border: 1px solid rgba(113, 216, 138, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--success);
    }
    .shield-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .shield-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    /* 4-Digit OTP PIN Boxes */
    .otp-pin-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .otp-digit {
      width: 32px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    /* =========================================================
       MOBILE APP EMULATION FRAMES
       ========================================================= */
    .mobile-duo-container {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 16px 0;
      flex-wrap: wrap;
    }
    .phone-frame {
      width: 340px;
      height: 680px;
      background: var(--surface);
      border: 3px solid var(--border-strong);
      border-radius: 36px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-notch {
      height: 24px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .phone-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .phone-body::-webkit-scrollbar { display: none; }
    .phone-bottom-nav {
      height: 50px;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      font-size: 18px;
    }
    .phone-nav-icon {
      color: var(--text-secondary);
      cursor: pointer;
    }
    .phone-nav-icon.active { color: var(--primary); }

    /* Map Surface */
    .map-surface {
      background: var(--map-land);
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 280px;
      position: relative;
      overflow: hidden;
    }
    .map-svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- =========================================================
       GLOBAL PLATFORM HEADER
       ========================================================= -->
  <header class="platform-header">
    <div class="brand-section">
      <div class="brand-logo-badge">🚗</div>
      <div>
        <div class="brand-title">RideDrive<span>Ahead</span></div>
        <div class="brand-tagline">Your ride. Your car. Your driver.</div>
      </div>
    </div>

    <!-- Portal Switcher -->
    <nav class="portal-nav">
      <button class="portal-tab active" id="tab-customer" onclick="setPortal('CUSTOMER')">
        <span>👤</span> Customer Web
      </button>
      <button class="portal-tab" id="tab-driver" onclick="setPortal('DRIVER')">
        <span>👨‍✈️</span> Driver OS
      </button>
      <button class="portal-tab" id="tab-admin" onclick="setPortal('ADMIN')">
        <span>🏢</span> Admin Command Center
      </button>
      <button class="portal-tab" id="tab-mobile" onclick="setPortal('MOBILE')">
        <span>📱</span> Mobile Studio
      </button>
    </nav>

    <!-- Platform Telemetry & Controls -->
    <div class="platform-actions">
      <div class="status-pill">
        <div class="status-dot-pulse"></div>
        <span>184 Active Trips</span>
      </div>
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- =========================================================
       SUB-NAVIGATION FOR CUSTOMER & DRIVER EXPERIENCE
       ========================================================= -->
  <div class="subview-bar" id="customer-subnav">
    <button class="subview-tab active" onclick="setCustomerSub('OVERVIEW')">Overview & Booking</button>
    <button class="subview-tab" onclick="setCustomerSub('MYCAR')">My Car & Handover Protocol</button>
    <button class="subview-tab" onclick="setCustomerSub('ASSURANCE')">Airport Trip Assurance</button>
    <button class="subview-tab" onclick="setCustomerSub('TRUSTED')">Trusted Drivers & Recurring</button>
    <button class="subview-tab" onclick="setCustomerSub('SAFETY')">Safety Center & Telemetry</button>
    <button class="subview-tab" onclick="setCustomerSub('CORP')">Corporate & Family Accounts</button>
  </div>

  <div class="subview-bar" id="driver-subnav" style="display: none;">
    <button class="subview-tab active" onclick="setDriverSub('READINESS')">Readiness & Fatigue OS</button>
    <button class="subview-tab" onclick="setDriverSub('GIGS')">Gig Marketplace</button>
    <button class="subview-tab" onclick="setDriverSub('HANDOVER_SIGN')">Vehicle Handover Verification</button>
  </div>

  <div class="subview-bar" id="admin-subnav" style="display: none;">
    <button class="subview-tab active" onclick="setAdminSub('OPERATIONS')">Live Operations & Dispatch</button>
    <button class="subview-tab" onclick="setAdminSub('DRIVERS')">Driver Fleet & Fatigue Guard</button>
    <button class="subview-tab" onclick="setAdminSub('KYC')">KYC Verification Desk</button>
    <button class="subview-tab" onclick="setAdminSub('SUPPORT')">Support & Incident Tickets</button>
  </div>

  <!-- =========================================================
       MAIN WORKSPACE CONTENT CONTAINER
       ========================================================= -->
  <main class="main-workspace" id="app-container">
    <!-- Dynamic Content Rendered Here by JavaScript -->
  </main>

  <!-- =========================================================
       APPLICATION LOGIC & DATA MODELS
       ========================================================= */ -->
  <script>
    // Platform State
    let activePortal = 'CUSTOMER'; // CUSTOMER | DRIVER | ADMIN | MOBILE
    let customerSub = 'OVERVIEW';   // OVERVIEW | MYCAR | ASSURANCE | TRUSTED | SAFETY | CORP
    let driverSub = 'READINESS';    // READINESS | GIGS | HANDOVER_SIGN
    let adminSub = 'OPERATIONS';    // OPERATIONS | DRIVERS | KYC | SUPPORT
    let intentChoice = 'CAB';       // CAB (Book a cab) | CHAUFFEUR (Hire a driver)

    // Intermediate stops for multi-stop rides
    let hasIntermediateStop = false;

    // Chauffeur booking selections
    let chauffeurHours = '4h';
    let chauffeurTransmission = 'AT';

    // Handover state
    let handoverPreSigned = true;
    let handoverTripStarted = false;
    let handoverPostCompleted = false;

    // Driver OS state
    let isDriverOnline = true;
    let currentDutyMinutes = 342; // 5h 42m

    // Mobility Tiers
    const CAB_TIERS = [
      { id: 'moto', icon: '🛵', name: 'Bike Taxi', meta: 'Beat peak traffic • 1 seat', fare: 49, eta: '3 min', locked: true },
      { id: 'auto', icon: '🛺', name: 'Auto Rickshaw', meta: 'Meter guarantee • 3 seats', fare: 85, eta: '4 min', locked: true },
      { id: 'go', icon: '🚗', name: 'Go Economy', meta: 'AC Hatchback • 4 seats', fare: 189, eta: '5 min', locked: true },
      { id: 'sedan', icon: '🚕', name: 'Premier Sedan', meta: 'Spacious legroom • 4 seats', fare: 289, eta: '6 min', locked: true },
      { id: 'suv', icon: '🚙', name: 'SUV XL', meta: 'Innova / Ertiga • 6 seats', fare: 420, eta: '8 min', locked: true }
    ];
    let selectedCabTier = CAB_TIERS[2];

    // Theme Management
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('rda_theme', newTheme);
    }

    // Portal Navigation
    function setPortal(portal) {
      activePortal = portal;
      document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${portal.toLowerCase()}`).classList.add('active');

      document.getElementById('customer-subnav').style.display = portal === 'CUSTOMER' ? 'flex' : 'none';
      document.getElementById('driver-subnav').style.display = portal === 'DRIVER' ? 'flex' : 'none';
      document.getElementById('admin-subnav').style.display = portal === 'ADMIN' ? 'flex' : 'none';

      renderApp();
    }

    function setCustomerSub(sub) {
      customerSub = sub;
      updateSubnavActive('customer-subnav', sub);
      renderApp();
    }

    function setDriverSub(sub) {
      driverSub = sub;
      updateSubnavActive('driver-subnav', sub);
      renderApp();
    }

    function setAdminSub(sub) {
      adminSub = sub;
      updateSubnavActive('admin-subnav', sub);
      renderApp();
    }

    function updateSubnavActive(containerId, activeSub) {
      const container = document.getElementById(containerId);
      const btns = container.querySelectorAll('.subview-tab');
      btns.forEach(btn => {
        if (btn.getAttribute('onclick').includes(activeSub)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Toggle Intent
    function setIntent(choice) {
      intentChoice = choice;
      renderApp();
    }

    // =========================================================
    // VIEW BUILDER FUNCTIONS
    // =========================================================

    // 1. CUSTOMER PORTAL VIEWS
    function renderCustomerPortal() {
      if (customerSub === 'MYCAR') return renderMyCarAndHandover();
      if (customerSub === 'ASSURANCE') return renderAirportAssurance();
      if (customerSub === 'TRUSTED') return renderTrustedAndRecurring();
      if (customerSub === 'SAFETY') return renderSafetyCenter();
      if (customerSub === 'CORP') return renderCorporateAndFamily();
      return renderCustomerOverview();
    }

    function renderCustomerOverview() {
      return `
        <!-- Central Decision: Book a Cab vs Hire a Driver -->
        <div class="intent-hero">
          <div class="intent-label">RideDriveAhead — What do you need today?</div>
          <div class="intent-grid">
            <div class="intent-card ${intentChoice === 'CAB' ? 'active' : ''}" onclick="setIntent('CAB')">
              <span class="intent-badge">Instant & City Mobility</span>
              <div class="intent-card-title">BOOK A CAB</div>
              <div class="intent-card-sub">I need a ride. Upfront locked fares, verified captains, multi-stop trips, and airport transfers.</div>
            </div>
            <div class="intent-card ${intentChoice === 'CHAUFFEUR' ? 'active' : ''}" onclick="setIntent('CHAUFFEUR')">
              <span class="intent-badge">Personal Vehicle Chauffeur</span>
              <div class="intent-card-title">HIRE A DRIVER</div>
              <div class="intent-card-sub">I have my own car. Verified AT/MT certified chauffeurs for hourly duties, events, and outstation trips.</div>
            </div>
          </div>
        </div>

        <div class="grid-2col">
          <!-- Left Column: Booking Flow -->
          <div>
            ${intentChoice === 'CAB' ? renderCabBookingFlow() : renderChauffeurBookingFlow()}
          </div>

          <!-- Right Column: Live Context Map & Trust / OTP Card -->
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Live Radar Map -->
            <div class="card" style="padding: 14px;">
              <div class="card-header" style="margin-bottom: 10px;">
                <div class="card-title">
                  <span>📍</span> Bengaluru Urban Telemetry
                </div>
                <span class="status-pill" style="font-size: 10px;">Normal Surge 1.0x</span>
              </div>
              <div class="map-surface">
                <svg class="map-svg" viewBox="0 0 400 280">
                  <path d="M 0 100 Q 150 70 400 120" stroke="var(--map-road)" stroke-width="12" fill="none" />
                  <path d="M 80 0 Q 140 140 180 280" stroke="var(--map-road)" stroke-width="10" fill="none" />
                  <path d="M 0 200 C 120 180 280 240 400 190" stroke="var(--map-road)" stroke-width="14" fill="none" />
                  <!-- Route path -->
                  <path d="M 80 140 Q 140 160 260 210" stroke="var(--map-route)" stroke-width="5" stroke-dasharray="6,4" fill="none" />

                  <!-- Pickup Marker -->
                  <circle cx="80" cy="140" r="7" fill="var(--success)" />
                  <text x="94" y="144" fill="var(--text)" font-size="11" font-weight="700">Pickup: Koramangala</text>

                  <!-- Drop Marker -->
                  <circle cx="260" cy="210" r="7" fill="var(--danger)" />
                  <text x="274" y="214" fill="var(--text)" font-size="11" font-weight="700">Drop: Indiranagar</text>

                  <!-- Real-time nearby vehicle dot -->
                  <circle cx="110" cy="120" r="5" fill="var(--primary)" />
                  <circle cx="160" cy="180" r="5" fill="var(--primary)" />
                  <circle cx="230" cy="230" r="5" fill="var(--primary)" />
                </svg>
              </div>
            </div>

            <!-- Active Trip Verification HUD -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">
                  <span>🛡️</span> Trip Verification & PIN
                </div>
                <div class="verified-pill">Protected</div>
              </div>

              <div style="background: var(--surface-2); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase;">START TRIP PIN</div>
                  <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 2px;">Share only with driver upon pickup</div>
                </div>
                <div class="otp-pin-display">
                  <div class="otp-digit">4</div>
                  <div class="otp-digit">7</div>
                  <div class="otp-digit">9</div>
                  <div class="otp-digit">2</div>
                </div>
              </div>

              <!-- Driver Trust Outcome -->
              <div class="trust-profile-card" style="margin-bottom: 0;">
                <div class="trust-header">
                  <div class="trust-driver-info">
                    <div class="trust-avatar">RK</div>
                    <div>
                      <div class="trust-driver-name">Ramesh Kumar</div>
                      <div class="trust-driver-rating">★ 4.9 • 1,284 completed trips</div>
                    </div>
                  </div>
                  <span class="verified-pill">Verified Driver</span>
                </div>
                <div class="trust-badges-flow">
                  <div class="trust-chip"><span>✓</span> Identity Verified</div>
                  <div class="trust-chip"><span>✓</span> Commercial DL Verified</div>
                  <div class="trust-chip"><span>✓</span> Automatic Certified</div>
                  <div class="trust-chip"><span>✓</span> Manual Certified</div>
                </div>
                <div class="trust-bar-row">
                  <div class="trust-bar-label">
                    <span>Vehicle Familiarity (Innova / Sedans)</span>
                    <span>92%</span>
                  </div>
                  <div class="trust-bar-track">
                    <div class="trust-bar-fill" style="width: 92%;"></div>
                  </div>
